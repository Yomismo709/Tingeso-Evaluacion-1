name: Pipeline CI/CD SIGA IPT

# Se ejecuta automáticamente al hacer "push" a la rama main o master
on:
  push:
    branches: [ "main", "master" ]

jobs:
  # 1. TRABAJO DE PRUEBAS (Unitarias e Integración)
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Dar permisos de ejecución a Maven
        run: chmod +x ./mvnw

      - name: Ejecutar pruebas unitarias y de integración con JaCoCo
        run: ./mvnw clean verify

  # 2. TRABAJO DE CONSTRUCCIÓN Y PUBLICACIÓN EN DOCKER HUB
  build-and-publish:
    needs: test-backend # Condición estricta: Solo se ejecuta si test-backend termina con éxito
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código del repositorio
        uses: actions/checkout@v4

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Construir y publicar imagen del Backend
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/siga-ipt-backend:latest

      - name: Construir y publicar imagen del Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/siga-ipt-frontend:latest