spring.application.name=siga-ipt

# PostgreSQL Database Configuration (configured via Environment Variables with local defaults)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/siga_ipt}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgrespassword}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# OpenAPI / Swagger UI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Keycloak JWT issuer
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/siga-ipt}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:8081/realms/siga-ipt/protocol/openid-connect/certs}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}


# Obliga a Spring Boot a ejecutar data.sql sin importar que sea PostgreSQL
spring.sql.init.mode=always
# Espera a que Hibernate cree las tablas antes de intentar insertar los datos
spring.jpa.defer-datasource-initialization=true