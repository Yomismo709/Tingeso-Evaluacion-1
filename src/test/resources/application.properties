spring.datasource.url=jdbc:h2:mem:siga-test;DB_CLOSE_DELAY=-1;NON_KEYWORDS=YEAR
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/siga-ipt
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8081/realms/siga-ipt/protocol/openid-connect/certs